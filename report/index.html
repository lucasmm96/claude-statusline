<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Statusline Report</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --orange: #d29922;
      --red: #f85149;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --surface: #f6f8fa;
        --surface2: #eaeef2;
        --border: #d0d7de;
        --text: #1f2328;
        --muted: #656d76;
        --accent: #0969da;
        --green: #1a7f37;
        --orange: #9a6700;
        --red: #cf222e;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    h1 { font-size: 14px; font-weight: 600; }
    .load-area { display: flex; gap: 6px; margin-left: auto; align-items: center; flex-wrap: wrap; }
    .btn {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: 0.85; }
    #url-in {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      width: 260px;
    }
    #stat-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .stat {
      padding: 8px 16px;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: none; }
    .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); }
    .stat-val { font-size: 18px; font-weight: 700; margin-top: 1px; }
    #main { display: flex; flex: 1; overflow: hidden; }
    #sessions {
      width: 210px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }
    .sess-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .sess-item:hover { background: var(--surface); }
    .sess-item.active { background: var(--surface2); border-left: 3px solid var(--accent); padding-left: 9px; }
    .sess-name { font-weight: 500; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sess-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
    #detail { flex: 1; overflow-y: auto; }
    .empty-state {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: var(--muted); flex-direction: column; gap: 8px;
    }
    .detail-header { padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .detail-header h2 { font-size: 15px; font-weight: 600; }
    .detail-header p { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .detail-stats {
      display: flex; gap: 24px; flex-wrap: wrap;
      padding: 10px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .ds-label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
    .ds-val { font-size: 14px; font-weight: 600; }
    .chart-section { padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .chart-section h3 {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px;
    }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; font-size: 11px; color: var(--muted); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
    .chart-wrap { position: relative; height: 150px; }
    .log-section { padding: 14px 18px 24px; }
    .log-section h3 {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 10px;
    }
    table.log { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.log th {
      text-align: right; padding: 5px 8px;
      border-bottom: 1px solid var(--border);
      color: var(--muted); font-weight: 500; font-size: 11px;
    }
    table.log th:first-child, table.log th:nth-child(2) { text-align: left; }
    table.log td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--border); }
    table.log td:first-child, table.log td:nth-child(2) { text-align: left; }
    table.log tr:last-child td { border-bottom: none; }
    .compact-row td { color: var(--orange); font-style: italic; }
  </style>
</head>
<body>

<header>
  <h1>Claude Statusline Report</h1>
  <div class="load-area">
    <input type="file" id="file-in" accept=".json" style="display:none">
    <button class="btn" id="file-btn">Load file</button>
    <input type="text" id="url-in" placeholder="Raw JSON URL…">
    <button class="btn btn-primary" id="url-btn">Load URL</button>
  </div>
</header>

<div id="stat-bar">
  <div class="stat"><div class="stat-label">Sessions</div><div class="stat-val" id="s-count">—</div></div>
  <div class="stat"><div class="stat-label">Total Tokens</div><div class="stat-val" id="s-tokens">—</div></div>
  <div class="stat"><div class="stat-label">Cache Hit Rate</div><div class="stat-val" id="s-cache">—</div></div>
  <div class="stat"><div class="stat-label">Compacts</div><div class="stat-val" id="s-compacts">—</div></div>
</div>

<div id="main">
  <div id="sessions"><div class="empty-state" style="height:100%">Load a file to begin</div></div>
  <div id="detail"><div class="empty-state">Select a session</div></div>
</div>

<script>
// Token colors
const TC = {
  input:       '#60a5fa',
  cache_read:  '#4ade80',
  cache_write: '#fb923c',
  output:      '#a78bfa',
};

let globalData = null;
let tokChart = null;
let ctxChart = null;

// Chart.js plugin: vertical dashed lines at compact events
const compactPlugin = {
  id: 'compacts',
  afterDraw(chart) {
    const indices = chart.options.plugins?.compacts?.indices;
    if (!indices?.length) return;
    const { ctx, chartArea, scales } = chart;
    ctx.save();
    ctx.strokeStyle = '#fb923c';
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1.5;
    for (const xi of indices) {
      const px = xi < chart.data.labels.length
        ? scales.x.getPixelForValue(xi)
        : chartArea.right;
      ctx.beginPath();
      ctx.moveTo(px, chartArea.top);
      ctx.lineTo(px, chartArea.bottom);
      ctx.stroke();
    }
    ctx.restore();
  }
};
Chart.register(compactPlugin);

// Helpers
function fmtN(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(n);
}
function fmtDt(iso) {
  return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function fmtDur(a, b) {
  const m = Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));
  return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
}

// Remove consecutive entries with identical token values (streaming artifact)
function dedupe(log) {
  const out = [];
  for (const e of log) {
    if (e.event) { out.push(e); continue; }
    const prev = [...out].reverse().find(x => !x.event);
    if (prev &&
        prev.input_tokens === e.input_tokens &&
        prev.cache_read_tokens === e.cache_read_tokens &&
        prev.cache_write_tokens === e.cache_write_tokens &&
        prev.output_tokens === e.output_tokens) continue;
    out.push(e);
  }
  return out;
}

function sessStats(sess) {
  const log = dedupe(sess.log || []);
  const exch = log.filter(e => !e.event);
  const compacts = log.filter(e => e.event === 'compact').length;
  const total = exch.reduce((s, e) => s + e.input_tokens + e.cache_read_tokens + e.cache_write_tokens + e.output_tokens, 0);
  const cr = exch.reduce((s, e) => s + e.cache_read_tokens, 0);
  const totalIn = exch.reduce((s, e) => s + e.input_tokens + e.cache_read_tokens + e.cache_write_tokens, 0);
  const cacheHit = totalIn > 0 ? cr / totalIn * 100 : 0;
  return { log, exch, compacts, total, cacheHit };
}

// Data loading
document.getElementById('file-btn').onclick = () => document.getElementById('file-in').click();
document.getElementById('file-in').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => loadJson(ev.target.result);
  r.readAsText(f);
  e.target.value = '';
});
document.getElementById('url-btn').onclick = fetchUrl;
document.getElementById('url-in').addEventListener('keydown', e => { if (e.key === 'Enter') fetchUrl(); });

function fetchUrl() {
  const url = document.getElementById('url-in').value.trim();
  if (!url) return;
  fetch(url)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(loadJson)
    .catch(err => alert('Failed to load: ' + err.message));
}

function loadJson(text) {
  try {
    const d = JSON.parse(text);
    if (!d.sessions) throw new Error('Missing "sessions" key');
    globalData = d;
    renderAll();
  } catch(e) {
    alert('Invalid JSON: ' + e.message);
  }
}

// Auto-load from ?data= query param (for hosted/GitHub Pages use)
(function() {
  const u = new URLSearchParams(location.search).get('data');
  if (u) { document.getElementById('url-in').value = u; fetchUrl(); }
})();

// Render session list + summary bar
function renderAll() {
  const sessions = Object.values(globalData.sessions)
    .sort((a, b) => new Date(b.last_activity_at) - new Date(a.last_activity_at));

  let totalTok = 0, totalComp = 0, totalCR = 0, totalIn = 0;
  for (const s of sessions) {
    const st = sessStats(s);
    totalTok += st.total;
    totalComp += st.compacts;
    totalCR += st.exch.reduce((x, e) => x + e.cache_read_tokens, 0);
    totalIn += st.exch.reduce((x, e) => x + e.input_tokens + e.cache_read_tokens + e.cache_write_tokens, 0);
  }

  document.getElementById('s-count').textContent = sessions.length;
  document.getElementById('s-tokens').textContent = fmtN(totalTok);
  document.getElementById('s-cache').textContent = totalIn > 0 ? Math.round(totalCR / totalIn * 100) + '%' : '—';
  document.getElementById('s-compacts').textContent = totalComp;

  const list = document.getElementById('sessions');
  list.innerHTML = '';
  sessions.forEach((sess, i) => {
    const st = sessStats(sess);
    const el = document.createElement('div');
    el.className = 'sess-item';
    el.innerHTML = `
      <div class="sess-name" title="${sess.session_name || sess.session_id}">${sess.session_name || sess.session_id.slice(0, 8)}</div>
      <div class="sess-meta">${sess.model}</div>
      <div class="sess-meta">${fmtN(st.total)} &middot; ${fmtDt(sess.started_at)}</div>
    `;
    el.onclick = () => {
      document.querySelectorAll('.sess-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      renderDetail(sess);
    };
    list.appendChild(el);
    if (i === 0) { el.classList.add('active'); renderDetail(sess); }
  });
}

// Detail view
function renderDetail(sess) {
  const st = sessStats(sess);
  const detail = document.getElementById('detail');

  detail.innerHTML = `
    <div class="detail-header">
      <h2>${sess.session_name || sess.session_id}</h2>
      <p>${sess.model} &middot; ${fmtDt(sess.started_at)} &middot; ${fmtDur(sess.started_at, sess.last_activity_at)} &middot; ${st.exch.length} exchanges</p>
    </div>
    <div class="detail-stats">
      <div><div class="ds-label">Total tokens</div><div class="ds-val">${fmtN(st.total)}</div></div>
      <div><div class="ds-label">Cache hit rate</div><div class="ds-val">${Math.round(st.cacheHit)}%</div></div>
      <div><div class="ds-label">Compacts</div><div class="ds-val">${st.compacts}</div></div>
      <div><div class="ds-label">Last context</div><div class="ds-val">${sess._state?.last_ctx ?? '—'}%</div></div>
    </div>
    <div class="chart-section">
      <h3>Tokens per Exchange</h3>
      <div class="legend">
        <span><span class="dot" style="background:${TC.input}"></span>Input</span>
        <span><span class="dot" style="background:${TC.cache_read}"></span>Cache read</span>
        <span><span class="dot" style="background:${TC.cache_write}"></span>Cache write</span>
        <span><span class="dot" style="background:${TC.output}"></span>Output</span>
        <span style="color:var(--orange)">&#10072; Compact</span>
      </div>
      <div class="chart-wrap"><canvas id="c-tok"></canvas></div>
    </div>
    <div class="chart-section">
      <h3>Context Window Usage</h3>
      <div class="chart-wrap"><canvas id="c-ctx"></canvas></div>
    </div>
    <div class="log-section">
      <h3>Exchange Log</h3>
      ${buildLogTable(st.log)}
    </div>
  `;

  buildCharts(st.log);
}

function buildLogTable(log) {
  let rows = '';
  let i = 0;
  for (const e of log) {
    if (e.event === 'compact') {
      rows += `<tr class="compact-row"><td colspan="8">⚡ Compact — context reset to ${e.context_pct}%</td></tr>`;
    } else {
      i++;
      const t = e.input_tokens + e.cache_read_tokens + e.cache_write_tokens + e.output_tokens;
      rows += `<tr>
        <td>${i}</td>
        <td>${fmtDt(e.at)}</td>
        <td>${fmtN(e.input_tokens)}</td>
        <td>${fmtN(e.cache_read_tokens)}</td>
        <td>${fmtN(e.cache_write_tokens)}</td>
        <td>${fmtN(e.output_tokens)}</td>
        <td>${fmtN(t)}</td>
        <td>${e.context_pct}%</td>
      </tr>`;
    }
  }
  return `<table class="log">
    <thead><tr>
      <th>#</th><th>Time</th>
      <th>Input</th><th>Cache rd</th><th>Cache wr</th><th>Output</th><th>Total</th><th>Ctx</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function buildCharts(log) {
  if (tokChart) { tokChart.destroy(); tokChart = null; }
  if (ctxChart) { ctxChart.destroy(); ctxChart = null; }

  const labels = [], inp = [], cr = [], cw = [], out = [], ctxArr = [];
  const compactXs = [];
  let xi = 0;

  for (const e of log) {
    if (e.event === 'compact') {
      compactXs.push(xi);
    } else {
      labels.push(xi + 1);
      inp.push(e.input_tokens);
      cr.push(e.cache_read_tokens);
      cw.push(e.cache_write_tokens);
      out.push(e.output_tokens);
      ctxArr.push(e.context_pct);
      xi++;
    }
  }

  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const grid = dark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.07)';
  const tick = dark ? '#8b949e' : '#656d76';

  const baseScales = {
    x: { ticks: { color: tick, font: { size: 10 }, maxTicksLimit: 15 }, grid: { color: grid } },
    y: { ticks: { color: tick, font: { size: 10 } }, grid: { color: grid } }
  };

  tokChart = new Chart(document.getElementById('c-tok'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Input',       data: inp, backgroundColor: TC.input,       stack: 's' },
        { label: 'Cache read',  data: cr,  backgroundColor: TC.cache_read,  stack: 's' },
        { label: 'Cache write', data: cw,  backgroundColor: TC.cache_write, stack: 's' },
        { label: 'Output',      data: out, backgroundColor: TC.output,      stack: 's' },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: false },
        compacts: { indices: compactXs },
        tooltip: {
          callbacks: {
            footer: items => 'Total: ' + fmtN(items.reduce((s, i) => s + i.raw, 0))
          }
        }
      },
      scales: {
        x: { ...baseScales.x, stacked: true },
        y: { ...baseScales.y, stacked: true, ticks: { ...baseScales.y.ticks, callback: v => fmtN(v) } }
      }
    }
  });

  ctxChart = new Chart(document.getElementById('c-ctx'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Context %',
        data: ctxArr,
        borderColor: '#60a5fa',
        backgroundColor: 'rgba(96,165,250,0.1)',
        borderWidth: 2,
        pointRadius: 3,
        fill: true,
        tension: 0.3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: false },
        compacts: { indices: compactXs },
        tooltip: { callbacks: { label: item => 'Context: ' + item.raw + '%' } }
      },
      scales: {
        x: { ...baseScales.x },
        y: {
          ...baseScales.y,
          min: 0,
          max: 100,
          ticks: { ...baseScales.y.ticks, callback: v => v + '%' }
        }
      }
    }
  });
}
</script>
</body>
</html>
